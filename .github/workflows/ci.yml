name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check && pnpm test && pnpm run build && pnpm run verify:package
      - run: git diff --exit-code -- lib
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pcb-schematic-diagram-package
          path: '*.tgz'
